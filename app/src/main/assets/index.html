<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RetroQuiz - El Juego del Millón</title>
<style>


* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a2e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-y: auto;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
}

.game-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 500px;
    padding: 15px;
}

/* SCREENS */
.screen { display: none; }
.screen.active { display: block; }

/* MENU */
.menu-screen {
    text-align: center;
}
.menu-screen h1 {
    font-family: 'Courier New', monospace;
    font-size: 2.5em;
    background: linear-gradient(180deg, #ffd700, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    margin-bottom: 5px;
}
.menu-screen .subtitle {
    color: #888;
    font-size: 0.9em;
    margin-bottom: 10px;
}
.menu-logo {
    width: 120px;
    height: 120px;
    margin: 0 auto 15px;
    background: linear-gradient(135deg, #ffd700, #ff6b00);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    box-shadow: 0 0 40px rgba(255,215,0,0.3);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,215,0,0.3); }
    50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,215,0,0.5); }
}
.btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover { transform: scale(1.02); }
.btn:active { transform: scale(0.98); }
.btn-play {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    font-size: 1.3em;
    box-shadow: 0 4px 20px rgba(255,215,0,0.3);
}
.btn-categories {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}
.btn-leaderboard {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
}

/* CATEGORY GRID */
.category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.cat-btn {
    padding: 15px 8px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    color: white;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 0.9em;
    min-height: 85px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.cat-btn .cat-label, .cat-btn .emoji {
    white-space: normal;
    word-break: break-word;
}
.cat-btn:hover { transform: scale(1.05); }
.cat-btn:active { transform: scale(0.95); }
.cat-btn .cat-label { font-weight: bold; font-size: 0.85em; line-height: 1.25; text-shadow: 0 2px 8px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.9); }
.cat-btn .emoji { font-size: 1.6em; display: block; margin-bottom: 5px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
.cat-btn.selected {
    border-color: #ffd700;
    box-shadow: 0 0 0 2px rgba(255,215,0,0.4) inset;
}

.category-hero {
    position: relative;
    width: 100%;
    height: 190px;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(255,255,255,0.1);
    touch-action: pan-y;
}
.category-hero img#heroImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.hero-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5em;
}
.hero-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 1.3em;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
}
.hero-nav-left { left: 8px; }
.hero-nav-right { right: 8px; }
.hero-counter {
    position: absolute;
    bottom: 8px; right: 10px;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 0.7em;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 2;
}
.hero-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75));
    pointer-events: none;
}
.joystick-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 8px 0;
}
.joy-btn {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    color: white;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
}
.joy-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.22); }
.joy-arrow {
    width: 46px; height: 46px;
    font-size: 1.2em;
}
.joy-play {
    padding: 13px 26px;
    font-size: 1em;
    font-weight: bold;
    background: rgba(255,215,0,0.12);
    border-color: rgba(255,215,0,0.35);
    color: #ffd700;
    animation: playPulse 2.2s infinite;
}
@keyframes playPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.35); }
    50% { box-shadow: 0 0 0 7px rgba(255,215,0,0); }
}
.category-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 6px 0;
}
.category-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: all 0.3s;
}
.category-dot.active {
    background: #ffd700;
    width: 20px;
    border-radius: 4px;
}


/* GAME */
.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 10px 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
}
.game-header .question-num {
    color: #ffd700;
    font-weight: bold;
}
.game-header .score {
    color: #ffd700;
    font-family: 'Courier New', monospace;
    font-size: 1.2em;
}

.question-box {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 15px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 1px solid rgba(255,215,0,0.2);
}
.question-box p {
    color: white;
    font-size: 1.15em;
    line-height: 1.5;
}

.options-grid {
    display: grid;
    gap: 10px;
}
.option-btn {
    padding: 15px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: white;
    text-align: left;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1em;
    display: flex;
    align-items: center;
}
.option-btn .letter {
    display: inline-flex;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    font-weight: bold;
    flex-shrink: 0;
}
.option-btn:hover { background: rgba(255,255,255,0.15); }
.option-btn.correct { 
    border-color: #00e676; 
    background: rgba(0,230,118,0.2);
    animation: flashGreen 0.5s;
}
.option-btn.wrong { 
    border-color: #ff1744; 
    background: rgba(255,23,68,0.2);
    animation: flashRed 0.5s;
}
@keyframes flashGreen { 0%,100%{background:rgba(0,230,118,0.2)} 50%{background:rgba(0,230,118,0.4)} }
@keyframes flashRed { 0%,100%{background:rgba(255,23,68,0.2)} 50%{background:rgba(255,23,68,0.4)} }
.option-btn:disabled { cursor: default; opacity: 0.7; }

/* LIFELINES */
.lifelines {
    display: flex;
    gap: 10px;
    margin: 10px 0;
    justify-content: center;
}
.lifeline-btn {
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.3s;
}
.lifeline-btn:hover { background: rgba(255,255,255,0.15); color: white; }
.lifeline-btn.used { opacity: 0.3; cursor: default; }

/* RESULT */
.result-screen {
    text-align: center;
}
.result-screen .result-icon { font-size: 4em; margin-bottom: 15px; }
.result-screen h2 { color: white; font-size: 1.8em; margin-bottom: 10px; }
.result-screen p { color: #aaa; font-size: 1.1em; margin-bottom: 5px; }
.result-screen .final-score {
    font-family: 'Courier New', monospace;
    font-size: 3em;
    color: #ffd700;
    margin: 15px 0;
}

/* PRIZE LADDER */
.prize-ladder {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.8);
    border-radius: 10px;
    padding: 8px;
    font-size: 0.7em;
    z-index: 10;
}
.prize-step {
    padding: 3px 10px;
    margin: 2px 0;
    border-radius: 4px;
    color: #666;
    text-align: right;
}
.prize-step.current { color: #ffd700; background: rgba(255,215,0,0.15); }
.prize-step.milestone { color: #ff8c00; }

@media (max-width: 400px) {
    .menu-screen h1 { font-size: 1.8em; }
    .question-box p { font-size: 1em; }
    .prize-ladder { display: none; }
}

/* MODAL (reemplaza alert() nativo, que el WebView no muestra) */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal-box {
    background: linear-gradient(160deg, #1b2148, #0a0a2e);
    border: 2px solid #ffd700;
    border-radius: 16px;
    padding: 25px;
    max-width: 380px;
    width: 85%;
    box-shadow: 0 0 40px rgba(255,215,0,0.25);
}
.modal-box h3 {
    color: #ffd700;
    margin-bottom: 12px;
    font-size: 1.2em;
}
.modal-box .modal-content {
    color: white;
    font-size: 1em;
    line-height: 1.5;
    margin-bottom: 18px;
}
.modal-bar-row {
    display: flex;
    align-items: center;
    margin: 6px 0;
    font-size: 0.9em;
    color: #ccc;
}
.modal-bar-label { width: 30px; flex-shrink: 0; }
.modal-bar-track {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    height: 16px;
    overflow: hidden;
    margin: 0 8px;
}
.modal-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
}
.modal-box .btn { margin: 0; }
</style>
</head>

// ===== SOUND ENGINE (retro 8-bit, sin archivos de audio) =====
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function playTone(freq, duration, type, delay, volume) {
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        const startTime = ctx.currentTime + (delay || 0);
        gain.gain.setValueAtTime(volume || 0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
    } catch(e) {}
}
function soundClick() { playTone(600, 0.08, 'square', 0, 0.12); }
function soundCorrect() {
    playTone(523, 0.12, 'square', 0, 0.18);
    playTone(659, 0.12, 'square', 0.1, 0.18);
    playTone(784, 0.2, 'square', 0.2, 0.18);
}
function soundWrong() {

    playTone(200, 0.5, 'sawtooth', 0.5, 0.18);
}

function shuffle(arr) {
    for(let i=arr.length-1; i>0; i--) {
        let j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

    document.getElementById('customScreen').classList.add('active');
    document.getElementById('customStatus').textContent = '';
    document.getElementById('customGameInput').value = '';
}

window.searchCustomGame = async function searchCustomGame() {
    try {
        const input = document.getElementById('customGameInput');
        const gameName = input.value.trim();
        const statusEl = document.getElementById('customStatus');
        const btn = document.getElementById('customSearchBtn');

        if(!gameName) {
            statusEl.style.color = '#ff6b6b';
            statusEl.textContent = 'Escribí el nombre de un juego primero';
            return;
        }

        soundClick();
        btn.disabled = true;
        statusEl.style.color = '#ffd700';
        statusEl.textContent = '⏳ Generando preguntas... (puede tardar unos segundos la primera vez)';

        if (window.Android && window.Android.showAd) { window.Android.showAd(); }

        const res = await fetch(CUSTOM_API_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({game: gameName, grounded: true})
        });
        if(!res.ok) throw new Error('Servidor respondió ' + res.status);
        const data = await res.json();
        if(!data.questions || data.questions.length < 5) throw new Error('Muy pocas preguntas generadas');

        statusEl.style.color = '#00e676';
        statusEl.textContent = `✅ ${data.questions.length} preguntas listas sobre ${data.game}!`;
        setTimeout(() => {
            btn.disabled = false;
            beginGame(shuffle([...data.questions]).slice(0, 15));
        }, 700);
    } catch(e) {
        const btn = document.getElementById('customSearchBtn');
        const statusEl = document.getElementById('customStatus');
        if(btn) btn.disabled = false;
        if(statusEl) {
            statusEl.style.color = '#ff6b6b';
            statusEl.textContent = '❌ ' + (e.message || 'No se pudo conectar');
        }
        showModal('⚠️ Error al buscar preguntas', String(e.message || e));
    }
}

};

let currentCategoryIndex = 0;

let currentImageIndex = 0;

function renderCategoryHero() {
    const cat = CATEGORY_ORDER[currentCategoryIndex];
    category = cat;
    currentImageIndex = 0;

    document.getElementById('categoryTitle').textContent = CATEGORY_NAMES[cat];
    document.getElementById('categoryInfo').textContent = CATEGORY_INFO[cat];

    document.querySelectorAll('.category-dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentCategoryIndex);
    });

    renderHeroImage();
}

function renderHeroImage() {
    const cat = CATEGORY_ORDER[currentCategoryIndex];
    const img = document.getElementById('heroImage');
    const fallback = document.getElementById('heroFallback');
    const counter = document.getElementById('heroCounter');
    const navLeft = document.getElementById('heroNavLeft');
    const navRight = document.getElementById('heroNavRight');
    const hero = document.getElementById('categoryHero');

    const images = CAROUSEL_IMAGES[cat];

    if (cat === 'all' || !images || images.length === 0) {
        hero.style.background = 'linear-gradient(135deg, rgba(255,215,0,0.22), rgba(255,140,0,0.22))';
        img.style.display = 'none';
        fallback.style.display = 'flex';
        counter.style.display = 'none';
        navLeft.style.display = 'none';
        navRight.style.display = 'none';
    } else {
        hero.style.background = '#000';
        fallback.style.display = 'none';
        img.style.display = 'block';
        img.src = images[currentImageIndex];
        counter.style.display = 'block';
        counter.textContent = `${currentImageIndex + 1}/${images.length}`;
        navLeft.style.display = 'flex';
        navRight.style.display = 'flex';
    }
}

function prevImage(e) {
    if (e) e.stopPropagation();
    soundClick();
    const cat = CATEGORY_ORDER[currentCategoryIndex];
    const images = CAROUSEL_IMAGES[cat];
    if (!images) return;
    currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
    renderHeroImage();
}

function nextImage(e) {
    if (e) e.stopPropagation();
    soundClick();
    const cat = CATEGORY_ORDER[currentCategoryIndex];
    const images = CAROUSEL_IMAGES[cat];
    if (!images) return;
    currentImageIndex = (currentImageIndex + 1) % images.length;
    renderHeroImage();
}

// Deslizar con el dedo sobre la imagen grande
(function setupHeroSwipe() {
    let touchStartX = 0;
    document.addEventListener('DOMContentLoaded', attachSwipe);
    function attachSwipe() {
        const hero = document.getElementById('categoryHero');
        if (!hero) return;
        hero.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
        hero.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 40) {
                if (dx < 0) nextImage(); else prevImage();
            }
        }, {passive:true});
    }
    attachSwipe();
})();

function prevCategory() {
    soundClick();
    currentCategoryIndex = (currentCategoryIndex - 1 + CATEGORY_ORDER.length) % CATEGORY_ORDER.length;
    renderCategoryHero();
}

function nextCategory() {
    soundClick();
    currentCategoryIndex = (currentCategoryIndex + 1) % CATEGORY_ORDER.length;
    renderCategoryHero();
}

function buildCategoryDots() {
    const container = document.getElementById('categoryDots');
    container.innerHTML = CATEGORY_ORDER.map(() => '<div class="category-dot"></div>').join('');
}

function selectCategory(cat, el) {
    soundClick();
    category = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
}

function buildPrizeLadder() {
    let html = '';
    for(let i=14; i>=0; i--) {
        let cls = 'prize-step';
        if(i === currentQ) cls += ' current';
        if(MILESTONES.includes(i)) cls += ' milestone';
        html += `<div class="${cls}">${PRIZES[i]}</div>`;
    }
    document.getElementById('prizeLadder').innerHTML = html;
}

function beginGame(questionsArray) {
    currentQuestions = questionsArray;
    currentQ = 0;
    score = 0;
    fiftyUsed = false;
    phoneUsed = false;
    audienceUsed = false;
    answering = false;
    reviveUsed = false;
    
    document.getElementById('fiftyBtn').className = 'lifeline-btn';
    document.getElementById('phoneBtn').className = 'lifeline-btn';
    document.getElementById('audienceBtn').className = 'lifeline-btn';
    
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active');
    showQuestion();
}

function startGame() {
    soundClick();
    // Filter questions by category
    let pool = category === 'all' ? [...QUESTIONS] : QUESTIONS.filter(q => q.cat === category);
    if(pool.length < 15) pool = [...QUESTIONS]; // Fallback
    beginGame(shuffle(pool).slice(0, 15));
}

function showQuestion() {
    if(currentQ >= 15) { endGame(true); return; }
    const q = currentQuestions[currentQ];
    answering = true;
    document.getElementById('explanationBox').style.display = 'none';
    
    document.getElementById('questionNum').textContent = `Pregunta ${currentQ+1}/15`;
    document.getElementById('scoreDisplay').textContent = score > 0 ? `$${score.toLocaleString()}` : '$0';
    document.getElementById('questionText').textContent = q.q;
    
    const cats = {nes:'NES/SNES',play:'PlayStation',arcade:'Arcade',sega:'Sega',n64:'N64/GC',pc:'PC Gaming',retro:'Cultura Retro',all:'Todas'};
    document.getElementById('categoryDisplay').textContent = `📂 ${cats[q.cat] || 'Mixto'}`;
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    const letters = ['A','B','C','D'];
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt}`;
        btn.onclick = () => answerQuestion(i);
        btn.id = `opt${i}`;
        container.appendChild(btn);
    });
    
    buildPrizeLadder();
}

function answerQuestion(selected) {
    if(!answering) return;
    answering = false;
    
    const q = currentQuestions[currentQ];
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.disabled = true);
    
    let wasCorrect = (selected === q.c);

    if(wasCorrect) {
        soundCorrect();
        btns[selected].classList.add('correct');
        const prizeMap = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
        score = prizeMap[currentQ];
        document.getElementById('scoreDisplay').textContent = `$${score.toLocaleString()}`;
    } else {
        soundWrong();
        btns[selected].classList.add('wrong');
        btns[q.c].classList.add('correct');
        
        let safeScore = 0;
        for(let i=currentQ-1; i>=0; i--) {
            if(MILESTONES.includes(i)) {
                safeScore = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000][i];
                break;
            }
        }
        score = safeScore;
    }

    showExplanationBox(q, wasCorrect);
}

function showExplanationBox(q, wasCorrect) {
    const box = document.getElementById('explanationBox');
    const text = document.getElementById('explanationText');
    const label = document.getElementById('explanationLabel');
    const reviveBtn = document.getElementById('reviveBtn');

    label.textContent = wasCorrect ? '✅ ¡Correcto!' : '❌ Incorrecto';
    label.style.color = wasCorrect ? '#00e676' : '#ff1744';

    if (q.e && q.e.trim()) {
        text.textContent = q.e;
        text.style.display = 'block';
    } else {
        text.style.display = 'none';
    }
    box.style.display = 'block';

    reviveBtn.style.display = (!wasCorrect && !reviveUsed) ? 'block' : 'none';

    const nextBtn = document.getElementById('nextQuestionBtn');
    nextBtn.textContent = wasCorrect && currentQ === 14 ? '🏆 VER RESULTADO' : (wasCorrect ? 'SIGUIENTE ➡️' : '🏆 VER RESULTADO');
    nextBtn.onclick = () => {
        soundClick();
        box.style.display = 'none';
        if(!wasCorrect) { endGame(false); return; }
        if(currentQ === 14) { endGame(true); return; }
        currentQ++;
        showQuestion();
    };
}

window.tryRevive = function tryRevive() {
    soundClick();
    const reviveBtn = document.getElementById('reviveBtn');
    reviveBtn.disabled = true;
    reviveBtn.textContent = '⏳ Cargando anuncio...';

    if (!(window.Android && window.Android.showRewardedRevive)) {
        reviveBtn.disabled = false;
        reviveBtn.textContent = '📺 VER ANUNCIO Y REVIVIR';
        showModal('⚠️ No disponible', 'No se pudo cargar el anuncio. Probá de nuevo en un momento.');
        return;
    }

    window.onReviveResult = function(success) {
        reviveBtn.disabled = false;
        reviveBtn.textContent = '📺 VER ANUNCIO Y REVIVIR';
        if (success) {
            reviveUsed = true;
            document.getElementById('explanationBox').style.display = 'none';
            answering = true;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => { b.disabled = false; b.classList.remove('correct', 'wrong'); });
            showModal('🎉 ¡Reviviste!', 'Podés responder esta pregunta de nuevo.');
        } else {
            showModal('😔 Sin recompensa', 'No se completó el anuncio, no se pudo revivir esta vez.');
        }
    };
    window.Android.showRewardedRevive('onReviveResult');
}

function useFifty() {
    if(fiftyUsed || !answering) return;
    soundLifeline();
    fiftyUsed = true;
    document.getElementById('fiftyBtn').classList.add('used');
    
    const q = currentQuestions[currentQ];
    let wrongs = q.o.map((_,i) => i).filter(i => i !== q.c);
    shuffle(wrongs);
    const toRemove = wrongs.slice(0, 2);
    
    toRemove.forEach(i => {
        const btn = document.getElementById(`opt${i}`);
        if(btn) btn.style.opacity = '0.3';
    });
}

function usePhone() {
    if(phoneUsed || !answering) return;
    soundLifeline();
    phoneUsed = true;
    document.getElementById('phoneBtn').classList.add('used');
    
    const q = currentQuestions[currentQ];
    // 70% chance to give correct answer
    const giveCorrect = Math.random() < 0.7;
    const hint = giveCorrect ? q.o[q.c] : q.o[(q.c + 1 + Math.floor(Math.random()*3)) % 4];
    
    showModal('📞 ¡Timbre!', `Tu amigo gamer dice:<br><br>"Mirá, estoy casi seguro que es... <b>${hint}</b>"`);
}

function useAudience() {
    if(audienceUsed || !answering) return;
    soundLifeline();
    audienceUsed = true;
    document.getElementById('audienceBtn').classList.add('used');
    
    const q = currentQuestions[currentQ];
    const correctPct = 55 + Math.floor(Math.random() * 35);
    let remaining = 100 - correctPct;
    let dist = [];
    for(let i=0; i<4; i++) {
        if(i === q.c) {
            dist.push(correctPct);
        } else {
            let p = Math.floor(remaining / (3 - dist.filter((_,j)=>j!==q.c).length));
            dist.push(p);
            remaining -= p;
        }
    }
    
    const letters = ['A','B','C','D'];
    const barsHtml = q.o.map((o,i) => `
        <div class="modal-bar-row">
            <span class="modal-bar-label">${letters[i]}</span>
            <div class="modal-bar-track"><div class="modal-bar-fill" style="width:${dist[i]}%"></div></div>
            <span>${dist[i]}%</span>
        </div>`).join('');
    showModal('👥 El público votó', barsHtml);
}

function endGame(won) {
    if(won) { soundWin(); } else { soundLose(); }
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('resultScreen').classList.add('active');
    
    if(won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultTitle').textContent = '¡FELICIDADES!';
        document.getElementById('resultSubtitle').textContent = '¡Te convertiste en el Millonario Gamer!';
    } else {
        document.getElementById('resultIcon').textContent = '💔';
        document.getElementById('resultTitle').textContent = '¡Fallaste!';
        document.getElementById('resultSubtitle').textContent = 'Te llevás un premio seguro:';
    }
    document.getElementById('finalScore').textContent = `$${score.toLocaleString()}`;
    document.getElementById('resultDetail').textContent = `Respondiste ${currentQ + (won?1:0)} preguntas`;
}

showMenu();

}catch(e){
 document.body.innerHTML="<div style='padding:40px;color:red'>Error: "+e.message+"</div>";
}</script>
