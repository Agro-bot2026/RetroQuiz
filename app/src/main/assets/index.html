<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RetroQuiz - El Juego del Millón</title>
<style>


* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a2e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
}

.game-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 500px;
    padding: 15px;
}

/* SCREENS */
.screen { display: none; }
.screen.active { display: block; }

/* MENU */
.menu-screen {
    text-align: center;
}
.menu-screen h1 {
    font-family: 'Courier New', monospace;
    font-size: 2.5em;
    background: linear-gradient(180deg, #ffd700, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    margin-bottom: 5px;
}
.menu-screen .subtitle {
    color: #888;
    font-size: 0.9em;
    margin-bottom: 10px;
}
.menu-logo {
    width: 120px;
    height: 120px;
    margin: 0 auto 15px;
    background: linear-gradient(135deg, #ffd700, #ff6b00);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    box-shadow: 0 0 40px rgba(255,215,0,0.3);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,215,0,0.3); }
    50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,215,0,0.5); }
}
.btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover { transform: scale(1.02); }
.btn:active { transform: scale(0.98); }
.btn-play {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    font-size: 1.3em;
    box-shadow: 0 4px 20px rgba(255,215,0,0.3);
}
.btn-categories {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}
.btn-leaderboard {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
}

/* CATEGORY GRID */
.category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.cat-btn {
    padding: 20px 10px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: white;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 0.9em;
}
.cat-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
.cat-btn:active { transform: scale(0.95); }
.cat-btn .emoji { font-size: 2em; display: block; margin-bottom: 5px; }
.cat-btn.selected {
    border-color: #ffd700;
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
}

/* GAME */
.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 10px 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
}
.game-header .question-num {
    color: #ffd700;
    font-weight: bold;
}
.game-header .score {
    color: #ffd700;
    font-family: 'Courier New', monospace;
    font-size: 1.2em;
}

.question-box {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 15px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 1px solid rgba(255,215,0,0.2);
}
.question-box p {
    color: white;
    font-size: 1.15em;
    line-height: 1.5;
}

.options-grid {
    display: grid;
    gap: 10px;
}
.option-btn {
    padding: 15px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: white;
    text-align: left;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1em;
    display: flex;
    align-items: center;
}
.option-btn .letter {
    display: inline-flex;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    font-weight: bold;
    flex-shrink: 0;
}
.option-btn:hover { background: rgba(255,255,255,0.15); }
.option-btn.correct { 
    border-color: #00e676; 
    background: rgba(0,230,118,0.2);
    animation: flashGreen 0.5s;
}
.option-btn.wrong { 
    border-color: #ff1744; 
    background: rgba(255,23,68,0.2);
    animation: flashRed 0.5s;
}
@keyframes flashGreen { 0%,100%{background:rgba(0,230,118,0.2)} 50%{background:rgba(0,230,118,0.4)} }
@keyframes flashRed { 0%,100%{background:rgba(255,23,68,0.2)} 50%{background:rgba(255,23,68,0.4)} }
.option-btn:disabled { cursor: default; opacity: 0.7; }

/* LIFELINES */
.lifelines {
    display: flex;
    gap: 10px;
    margin: 10px 0;
    justify-content: center;
}
.lifeline-btn {
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.3s;
}
.lifeline-btn:hover { background: rgba(255,255,255,0.15); color: white; }
.lifeline-btn.used { opacity: 0.3; cursor: default; }

/* RESULT */
.result-screen {
    text-align: center;
}
.result-screen .result-icon { font-size: 4em; margin-bottom: 15px; }
.result-screen h2 { color: white; font-size: 1.8em; margin-bottom: 10px; }
.result-screen p { color: #aaa; font-size: 1.1em; margin-bottom: 5px; }
.result-screen .final-score {
    font-family: 'Courier New', monospace;
    font-size: 3em;
    color: #ffd700;
    margin: 15px 0;
}

/* PRIZE LADDER */
.prize-ladder {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.8);
    border-radius: 10px;
    padding: 8px;
    font-size: 0.7em;
    z-index: 10;
}
.prize-step {
    padding: 3px 10px;
    margin: 2px 0;
    border-radius: 4px;
    color: #666;
    text-align: right;
}
.prize-step.current { color: #ffd700; background: rgba(255,215,0,0.15); }
.prize-step.milestone { color: #ff8c00; }

@media (max-width: 400px) {
    .menu-screen h1 { font-size: 1.8em; }
    .question-box p { font-size: 1em; }
    .prize-ladder { display: none; }
}
</style>
</head>

    </div>

    <div class="lifelines">

</div>

<!-- RESULT -->

</div>

</div>

let currentQuestions = [];
let currentQ = 0;
let score = 0;
let category = 'all';
let fiftyUsed = false;
let phoneUsed = false;
let audienceUsed = false;
let answering = false;

function shuffle(arr) {
    for(let i=arr.length-1; i>0; i--) {
        let j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showMenu() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('menuScreen').classList.add('active');
}

function showCategories() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('catScreen').classList.add('active');
}

function selectCategory(cat, el) {
    category = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
}

function buildPrizeLadder() {
    let html = '';
    for(let i=14; i>=0; i--) {
        let cls = 'prize-step';
        if(i === currentQ) cls += ' current';
        if(MILESTONES.includes(i)) cls += ' milestone';
        html += `<div class="${cls}">${PRIZES[i]}</div>`;
    }
    document.getElementById('prizeLadder').innerHTML = html;
}

function startGame() {
    // Filter questions by category
    let pool = category === 'all' ? [...QUESTIONS] : QUESTIONS.filter(q => q.cat === category);
    if(pool.length < 15) pool = [...QUESTIONS]; // Fallback
    currentQuestions = shuffle(pool).slice(0, 15);
    currentQ = 0;
    score = 0;
    fiftyUsed = false;
    phoneUsed = false;
    audienceUsed = false;
    answering = false;
    
    document.getElementById('fiftyBtn').className = 'lifeline-btn';
    document.getElementById('phoneBtn').className = 'lifeline-btn';
    document.getElementById('audienceBtn').className = 'lifeline-btn';
    
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active');
    showQuestion();
}

function showQuestion() {
    if(currentQ >= 15) { endGame(true); return; }
    const q = currentQuestions[currentQ];
    answering = true;
    
    document.getElementById('questionNum').textContent = `Pregunta ${currentQ+1}/15`;
    document.getElementById('scoreDisplay').textContent = score > 0 ? `$${score.toLocaleString()}` : '$0';
    document.getElementById('questionText').textContent = q.q;
    
    const cats = {nes:'NES/SNES',play:'PlayStation',arcade:'Arcade',sega:'Sega',n64:'N64/GC',pc:'PC Gaming',retro:'Cultura Retro',all:'Todas'};
    document.getElementById('categoryDisplay').textContent = `📂 ${cats[q.cat] || 'Mixto'}`;
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    const letters = ['A','B','C','D'];
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt}`;
        btn.onclick = () => answerQuestion(i);
        btn.id = `opt${i}`;
        container.appendChild(btn);
    });
    
    buildPrizeLadder();
}

function answerQuestion(selected) {
    if(!answering) return;
    answering = false;
    
    const q = currentQuestions[currentQ];
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.disabled = true);
    
    if(selected === q.c) {
        btns[selected].classList.add('correct');
        const prizeMap = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
        score = prizeMap[currentQ];
        document.getElementById('scoreDisplay').textContent = `$${score.toLocaleString()}`;
        
        if(currentQ === 14) {
            setTimeout(() => endGame(true), 1000);
        } else {
            setTimeout(() => {
                currentQ++;
                showQuestion();
            }, 1200);
        }
    } else {
        btns[selected].classList.add('wrong');
        btns[q.c].classList.add('correct');
        
        // Get safe prize (last milestone reached)
        let safeScore = 0;
        for(let i=currentQ-1; i>=0; i--) {
            if(MILESTONES.includes(i)) {
                safeScore = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000][i];
                break;
            }
        }
        score = safeScore;
        
        setTimeout(() => {
            endGame(false);
        }, 2000);
    }
}

function useFifty() {
    if(fiftyUsed || !answering) return;
    fiftyUsed = true;
    document.getElementById('fiftyBtn').classList.add('used');
    
    const q = currentQuestions[currentQ];
    let wrongs = q.o.map((_,i) => i).filter(i => i !== q.c);
    shuffle(wrongs);
    const toRemove = wrongs.slice(0, 2);
    
    toRemove.forEach(i => {
        const btn = document.getElementById(`opt${i}`);
        if(btn) btn.style.opacity = '0.3';
    });
}

function usePhone() {
    if(phoneUsed || !answering) return;
    phoneUsed = true;
    document.getElementById('phoneBtn').classList.add('used');
    
    const q = currentQuestions[currentQ];
    // 70% chance to give correct answer
    const giveCorrect = Math.random() < 0.7;
    const hint = giveCorrect ? q.o[q.c] : q.o[(q.c + 1 + Math.floor(Math.random()*3)) % 4];
    
    alert(`📞 *Timbre!* Tu amigo gamer dice:\n"Mirá, estoy casi seguro que es... ${hint}"`);
}

function useAudience() {
    if(audienceUsed || !answering) return;
    audienceUsed = true;
    document.getElementById('audienceBtn').classList.add('used');
    
    const q = currentQuestions[currentQ];
    const correctPct = 55 + Math.floor(Math.random() * 35);
    let remaining = 100 - correctPct;
    let dist = [];
    for(let i=0; i<4; i++) {
        if(i === q.c) {
            dist.push(correctPct);
        } else {
            let p = Math.floor(remaining / (3 - dist.filter((_,j)=>j!==q.c).length));
            dist.push(p);
            remaining -= p;
        }
    }
    
    alert(`👥 *El público votó:*\n\n${q.o.map((o,i) => `  ${['A','B','C','D'][i]}) ${o}: ${dist[i]}%`).join('\n')}`);
}

function endGame(won) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('resultScreen').classList.add('active');
    
    if(won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultTitle').textContent = '¡FELICIDADES!';
        document.getElementById('resultSubtitle').textContent = '¡Te convertiste en el Millonario Gamer!';
    } else {
        document.getElementById('resultIcon').textContent = '💔';
        document.getElementById('resultTitle').textContent = '¡Fallaste!';
        document.getElementById('resultSubtitle').textContent = 'Te llevás un premio seguro:';
    }
    document.getElementById('finalScore').textContent = `$${score.toLocaleString()}`;
    document.getElementById('resultDetail').textContent = `Respondiste ${currentQ + (won?1:0)} preguntas`;
}

showMenu();
</script>
